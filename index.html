const { useState, useEffect, useCallback } = React;
const html = htm.bind(React.createElement);

const C={bg:'#0A0F0D',surface:'#111812',card:'#172019',border:'#243028',
  gold:'#3ECBA0',green:'#3ECF8E',red:'#F56565',blue:'#4A9EFF',purple:'#9B7FEA',text:'#E8EFF0',muted:'#7A9490'};

// ── SUPABASE ──────────────────────────────────────────────────────────────────
function mkDB(url,key,token){
  const h=(e={})=>({apikey:key,Authorization:`Bearer ${token||key}`,'Content-Type':'application/json',...e});
  const req=async(path,opts={})=>{
    const res=await fetch(url+path,{...opts,headers:{...h(),...(opts.headers||{})}});
    if(opts.method==='DELETE') return null;
    const json=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(json.message||json.error_description||'Erro');
    return json;
  };
  return {
    get:(t,qs='')=>req(`/rest/v1/${t}?${qs}&order=created_at.desc`),
    post:(t,d)=>req(`/rest/v1/${t}`,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(d)}),
    patch:(t,id,d)=>req(`/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(d)}),
    del:(t,id)=>req(`/rest/v1/${t}?id=eq.${id}`,{method:'DELETE'}),
    upsert:(t,d,conflict)=>req(`/rest/v1/${t}?on_conflict=${conflict}`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(d)})
  };
}
async function sbLogin(url,key,email,pass){
  const res=await fetch(`${url}/auth/v1/token?grant_type=password`,{
    method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
  const d=await res.json();
  if(!res.ok) throw new Error(d.error_description||'Email ou senha inválidos');
  return d;
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fmt=v=>(v??0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtN=v=>(v??0).toLocaleString('pt-BR');
const pSt=(q,m)=>q<=m*0.5?'CRÍTICO':q<=m?'BAIXO':'OK';
const pCor=s=>s==='CRÍTICO'?C.red:s==='BAIXO'?C.gold:C.green;
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const now=new Date(); const ANO_ATUAL=now.getFullYear(); const MES_ATUAL=now.getMonth()+1;
const mesStr=m=>String(m).padStart(2,'0');
function useIsMobile(){
  const [m,setM]=useState(()=>window.innerWidth<768);
  useEffect(()=>{const fn=()=>setM(window.innerWidth<768);window.addEventListener('resize',fn);return()=>window.removeEventListener('resize',fn);},[]);

}

}
function Slct({label,options,value,onChange}){
  return html`<div style=${{marginBottom:13}}>
    ${label&&html`<div style=${{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:.8,marginBottom:5}}>${label}</div>`}
    <select value=${value} onChange=${onChange} style=${inputSt}>
      ${options.map(o=>html`<option key=${typeof o==='string'?o:o.v} value=${typeof o==='string'?o:o.v}>${typeof o==='string'?o:o.l}</option>`)}

}

const PBar=({value,color})=>html`<div style=${{background:C.border,borderRadius:99,height:6,overflow:'hidden',flex:1}}><div style=${{width:`${Math.min(100,value)}%`,height:'100%',background:color,borderRadius:99,transition:'width .4s'}}/></div>`;
const SecTitle=({children})=>html`<h2 style=${{fontSize:15,fontWeight:800,color:C.text,margin:'0 0 12px',borderLeft:`3px solid ${C.gold}`,paddingLeft:10}}>${children}</h2>`;
const Spin=()=>html`<div style=${{textAlign:'center',padding:40,color:C.muted,fontSize:13}}>Carregando...</div>`;
const Empty=({msg='Nenhum registro encontrado'})=>html`<div style=${{textAlign:'center',padding:30,color:C.muted,fontSize:13}}>${msg}</div>`;
const ErrBox=({msg})=>html`<div style=${{background:C.red+'11',border:`1px solid ${C.red}33`,borderRadius:8,padding:'10px 14px',color:C.red,fontSize:12,marginBottom:10}}>⚠ ${msg}</div>`;
const OkBox=({msg})=>html`<div style=${{background:C.green+'11',border:`1px solid ${C.green}33`,borderRadius:8,padding:'10px 14px',color:C.green,fontSize:12,marginBottom:10}}>✓ ${msg}</div>`;
function Modal({title,onClose,children}){

      </div>

}
function KpiCard({title,value,sub,icon,color,trend}){
  return html`<div style=${{background:C.card,borderRadius:12,padding:14,border:`1px solid ${C.border}`,position:'relative',overflow:'hidden'}}>

    <div style=${{fontSize:10,marginTop:3,display:'flex',gap:4,flexWrap:'wrap'}}>

      <span style=${{color:C.muted}}>${sub}</span>
    </div>
  </div>`;
}
function KpiGrid({children,isMobile}){
  return html`<div style=${{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(auto-fit,minmax(155px,1fr))',gap:10}}>${children}</div>`;
}

// Card de Meta do Mês
function MetaCard({metaMes,receitaMes,isMobile}){
  const pct=metaMes>0?Math.min(100,Math.round((receitaMes/metaMes)*100)):0;
  const falta=Math.max(0,metaMes-receitaMes);
  const cor=pct>=100?C.green:pct>=70?C.gold:pct>=40?C.blue:C.red;
  return html`<div style=${{background:C.card,borderRadius:12,padding:16,border:`2px solid ${cor}44`,gridColumn:isMobile?'span 2':'span 2',boxShadow:`0 0 20px ${cor}18`}}>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
      <div>
        <div style=${{fontSize:9,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:.8}}>🎯 Meta de Vendas — ${MESES[MES_ATUAL-1]}</div>
        <div style=${{fontSize:22,fontWeight:900,color:cor,marginTop:4}}>${fmt(metaMes)}</div>
        ${metaMes===0&&html`<div style=${{fontSize:11,color:C.muted,marginTop:2}}>Cadastre a meta em <strong style=${{color:C.gold}}>Metas</strong></div>`}
      </div>
      <div style=${{textAlign:'right'}}>
        <div style=${{fontSize:28,fontWeight:900,color:cor}}>${pct}%</div>
        <div style=${{fontSize:10,color:C.muted}}>atingido</div>
      </div>
    </div>
    ${metaMes>0&&html`<div>
      <div style=${{display:'flex',justifyContent:'space-between',marginBottom:6}}>
        <span style=${{fontSize:11,color:C.green}}>✓ Recebido: <strong>${fmt(receitaMes)}</strong></span>
        <span style=${{fontSize:11,color:falta>0?C.red:C.green}}>${falta>0?`Falta: ${fmt(falta)}`:'✅ Meta atingida!'}</span>
      </div>
      <${PBar} value=${pct} color=${cor}/>
    </div>`}
  </div>`;
}

// ── CONFIG ────────────────────────────────────────────────────────────────────
function ConfigScreen({onSave}){
  const [url,setUrl]=useState(()=>{try{return localStorage.getItem('kh_url')||''}catch{return ''}});
  const [key,setKey]=useState(()=>{try{return localStorage.getItem('kh_key')||''}catch{return ''}});
  const [err,setErr]=useState('');
  const save=()=>{
    const u=url.trim(),k=key.trim();
    if(!u||!k) return setErr('Preencha a URL e a Anon Key.');
    try{localStorage.setItem('kh_url',u);localStorage.setItem('kh_key',k);}catch{}
    onSave(u,k);
  };
  return html`<div style=${{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
    <div style=${{background:C.card,borderRadius:20,padding:32,width:'100%',maxWidth:420,border:`1px solid ${C.border}`}}>
      <div style=${{textAlign:'center',marginBottom:28}}>
        <div style=${{width:56,height:56,borderRadius:'50%',background:'#000',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',border:`2px solid ${C.gold}`}}>
          <svg width="28" height="22" viewBox="0 0 22 18" fill="none">
            <path d="M2 2L2 16M2 9L10 2M2 9L10 16" stroke="#3ECBA0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13 2L13 9M13 9L19 2M13 9L19 16" stroke="#3ECBA0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div style=${{fontSize:22,fontWeight:900,color:C.text}}><span style=${{color:C.gold}}>K</span>haus</div>
        <div style=${{fontSize:10,color:C.muted,letterSpacing:1.5,marginTop:2}}>BRINDES CORPORATIVOS</div>
        <div style=${{fontSize:12,color:C.muted,marginTop:14}}>Configure sua conexão com o Supabase</div>
      </div>
      <${Inp} label="URL do Projeto Supabase" value=${url} onInput=${e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"/>
      <${Inp} label="Anon Key (chave pública)" value=${key} onInput=${e=>setKey(e.target.value)} placeholder="eyJhbGci..." type="password"/>
      ${err&&html`<${ErrBox} msg=${err}/>`}
      <${Btn} full onClick=${save}>Conectar ao Banco de Dados</${Btn}>
      <div style=${{marginTop:16,padding:12,background:C.surface,borderRadius:10,fontSize:11,color:C.muted,lineHeight:1.7}}>
        <strong style=${{color:C.gold}}>Onde encontrar?</strong><br/>Supabase → Project Settings → API → URL e anon key
      </div>
    </div>
  </div>`;
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function LoginScreen({url,sbKey,onLogin,onBack}){
  const [email,setEmail]=useState('');const [pass,setPass]=useState('');
  const [err,setErr]=useState('');const [loading,setLoading]=useState(false);
  const login=async()=>{
    if(!email||!pass) return setErr('Preencha email e senha.');
    setLoading(true);setErr('');
    try{
      const s=await sbLogin(url,sbKey,email,pass);
      const db=mkDB(url,sbKey,s.access_token);
      const p=await db.get('profiles',`id=eq.${s.user.id}`);
      const role=p?.[0]?.role;const nome=p?.[0]?.nome||email;
      if(!role) throw new Error('Perfil não encontrado. Solicite ao administrador.');
      onLogin({token:s.access_token,userId:s.user.id,role,nome});
    }catch(e){setErr(e.message);}finally{setLoading(false);}
  };
  return html`<div style=${{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
    <div style=${{background:C.card,borderRadius:20,padding:32,width:'100%',maxWidth:380,border:`1px solid ${C.border}`}}>
      <div style=${{textAlign:'center',marginBottom:28}}><${Logo}/></div>
      <${Inp} label="Email" type="email" value=${email} onInput=${e=>setEmail(e.target.value)} placeholder="usuario@email.com"/>
      <${Inp} label="Senha" type="password" value=${pass} onInput=${e=>setPass(e.target.value)} placeholder="••••••••"/>
      ${err&&html`<${ErrBox} msg=${err}/>`}
      <${Btn} full onClick=${login} disabled=${loading}>${loading?'Entrando...':'Entrar'}</${Btn}>
      <div style=${{textAlign:'center',marginTop:12}}>
        <button onClick=${onBack} style=${{background:'none',border:'none',color:C.muted,fontSize:11,cursor:'pointer'}}>← Alterar configurações</button>
      </div>
    </div>
  </div>`;
}

// ── FORMS ─────────────────────────────────────────────────────────────────────
function FormProduto({db,item,onDone}){
  const [f,setF]=useState({nome:'',categoria:'Escrita',custo:0,preco:0,quantidade:0,estoque_minimo:0,...item});
  const [loading,setLoading]=useState(false);const [err,setErr]=useState('');
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const ct=+f.custo||0; const pc=+f.preco||0;
  const margemPct=pc>0?Math.round(((pc-ct)/pc)*100):0;
  const save=async()=>{
    if(!f.nome) return setErr('Nome obrigatório.');
    setLoading(true);setErr('');
    try{
      const d={...f,quantidade:+f.quantidade||0,estoque_minimo:+f.estoque_minimo||0,custo:+f.custo,preco:+f.preco,updated_at:new Date().toISOString()};
      if(item?.id) await db.patch('produtos',item.id,d); else await db.post('produtos',d);
      onDone(true);
    }catch(e){setErr(e.message);}finally{setLoading(false);}
  };
  const cats=['Escrita','Bolsas','Bebidas','Escritório','Vestuário','Tecnologia','Acessórios','Geral'];
  return html`<div>
    <${Inp} label="Nome do Item / Brinde" value=${f.nome} onInput=${set('nome')}/>
    <${Slct} label="Categoria" options=${cats} value=${f.categoria} onChange=${set('categoria')}/>
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <${Inp} label="Custo (R$)" type="number" step="0.01" value=${f.custo} onInput=${set('custo')}/>
      <${Inp} label="Preço Sugerido (R$)" type="number" step="0.01" value=${f.preco} onInput=${set('preco')}/>
    </div>
    ${pc>0&&html`<div style=${{background:C.surface,borderRadius:8,padding:'8px 12px',marginBottom:13,display:'flex',justifyContent:'space-between'}}>
      <span style=${{fontSize:11,color:C.muted}}>Margem</span>
      <span style=${{fontSize:13,fontWeight:800,color:margemPct>=0?C.green:C.red}}>${margemPct}%</span>
    </div>`}
    ${err&&html`<${ErrBox} msg=${err}/>`}
    <${Btn} full onClick=${save} disabled=${loading}>${loading?'Salvando...':item?.id?'Salvar':'Adicionar ao Catálogo'}</${Btn}>
  </div>`;
}

function FormPedido({db,item,onDone}){
  const cod=`PED-${ANO_ATUAL}-${String(Date.now()).slice(-4)}`;
  const [f,setF]=useState({codigo:cod,cliente_nome:'',valor_total:0,custo_total:0,quantidade_itens:0,prazo:'',status:'Orçamento',progresso:0,observacoes:'',...item});
  const [loading,setLoading]=useState(false);const [err,setErr]=useState('');
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const sts=['Orçamento','Aprovação','Arte','Produção','Entrega','Concluído'];
  const vt=+f.valor_total||0; const ct=+f.custo_total||0;
  const margemRS=vt-ct; const margemPct=vt>0?Math.round((margemRS/vt)*100):0;
  const save=async()=>{
    if(!f.cliente_nome) return setErr('Nome do cliente obrigatório.');
    setLoading(true);setErr('');
    try{
      const d={...f,valor_total:+f.valor_total,custo_total:+f.custo_total,quantidade_itens:+f.quantidade_itens,progresso:+f.progresso};
      const statusAnterior=item?.status||'';
      if(item?.id) await db.patch('pedidos',item.id,d); else await db.post('pedidos',d);
      // ── AUTO: cria A Receber quando entra em Produção ──────────────────────
      if(d.status==='Produção' && statusAnterior!=='Produção'){
        const venc=d.prazo||new Date(Date.now()+30*24*60*60*1000).toISOString().slice(0,10);
        await db.post('contas_receber',{
          cliente_nome:`${d.codigo} — ${d.cliente_nome}`,
          vencimento:venc,
          valor:d.valor_total,
          status:'A vencer'
        });
      }
      onDone(true);
    }catch(e){setErr(e.message);}finally{setLoading(false);}
  };
  return html`<div>
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <${Inp} label="Código" value=${f.codigo} onInput=${set('codigo')}/>
      <${Inp} label="Prazo" type="date" value=${f.prazo} onInput=${set('prazo')}/>
    </div>
    <${Inp} label="Nome do Cliente" value=${f.cliente_nome} onInput=${set('cliente_nome')}/>
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <${Inp} label="Valor de Venda (R$)" type="number" step="0.01" value=${f.valor_total} onInput=${set('valor_total')}/>
      <${Inp} label="Custo Total (R$)" type="number" step="0.01" value=${f.custo_total} onInput=${set('custo_total')}/>
    </div>
    <${Inp} label="Qtd de Itens" type="number" value=${f.quantidade_itens} onInput=${set('quantidade_itens')}/>
    ${vt>0&&html`<div style=${{background:C.surface,borderRadius:8,padding:'10px 12px',marginBottom:13,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <span style=${{fontSize:11,color:C.muted}}>Margem estimada</span>
      <span style=${{fontSize:14,fontWeight:800,color:margemRS>=0?C.green:C.red}}>${fmt(margemRS)} (${margemPct}%)</span>
    </div>`}
    <${Slct} label="Status" options=${sts} value=${f.status} onChange=${set('status')}/>
    <${Inp} label=${'Progresso: '+f.progresso+'%'} type="range" min="0" max="100" value=${f.progresso} onInput=${set('progresso')}/>
    <${Inp} label="Observações" value=${f.observacoes} onInput=${set('observacoes')}/>
    ${f.status==='Produção'&&(!item||item.status!=='Produção')&&html`<div style=${{background:C.green+'11',border:`1px solid ${C.green}33`,borderRadius:8,padding:'8px 12px',fontSize:11,color:C.green,marginBottom:10}}>
      ✓ Ao salvar, será gerado automaticamente um lançamento em <strong>A Receber</strong>
    </div>`}
    ${err&&html`<${ErrBox} msg=${err}/>`}
    <${Btn} full onClick=${save} disabled=${loading}>${loading?'Salvando...':item?.id?'Salvar':'Criar Pedido'}</${Btn}>
  </div>`;
}

function FormLancEdit({db,item,onDone}){
  const [f,setF]=useState({
    tipo:item?.tipo||'receita',
    descricao:item?.descricao||'',
    valor:item?.valor||0,
    data:item?.data||new Date().toISOString().slice(0,10),

function FormConta({db,tipo,item,onDone}){

  const save=async()=>{
    setLoading(true);setErr('');
    try{
      const t=tipo==='receber'?'contas_receber':'contas_pagar';
      const d={...f,valor:+f.valor};
      // contas_receber não tem coluna 'categoria'
      if(tipo==='receber'){ delete d.categoria; delete d.fornecedor; }
      if(tipo==='pagar')  { delete d.cliente_nome; }
      if(item?.id) await db.patch(t,item.id,d); else await db.post(t,d);
      // ── AUTO: contas_receber marcada como Pago → gera lançamento de receita
      const eraAgora = !item?.id && d.status==='Pago';

      if(tipo==='receber' && (eraAgora||mudouParaPago)){
        await db.post('lancamentos',{
          tipo:'receita',
          descricao:d.cliente_nome||'Recebimento',

          data:new Date().toISOString().slice(0,10),

        });

      onDone(true);
    }catch(e){setErr(e.message);}finally{setLoading(false);}
  };

    ${tipo==='receber'?html`<${Inp} label="Cliente / Descrição" value=${f.cliente_nome} onInput=${set('cliente_nome')}/>`:html`<${Inp} label="Fornecedor / Despesa" value=${f.fornecedor} onInput=${set('fornecedor')}/>`}

  </div>`;
}

// ── SEÇÃO: DASHBOARD ──────────────────────────────────────────────────────────
// ── GRÁFICO: GAUGE META ───────────────────────────────────────────────────────
function GaugeMeta({valor,meta}){
  const pct=meta>0?Math.min(1,valor/meta):0;
  const r=54; const cx=70; const cy=70;
  const circ=2*Math.PI*r;
  const dash=circ*pct;
  const cor=pct>=1?C.green:pct>=0.7?C.gold:pct>=0.4?C.blue:C.red;
  const dashArr=dash+' '+circ;
  const rotateT='rotate(-90 '+cx+' '+cy+')';
  return html`<div>
    <div style=${{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>🎯 Meta vs Realizado</div>
    <div style=${{display:'flex',alignItems:'center',gap:16}}>
      <svg viewBox="0 0 140 140" style=${{width:130,height:130,flexShrink:0}}>
        <circle cx=${cx} cy=${cy} r=${r} fill="none" stroke=${C.border} stroke-width="14"/>
        <circle cx=${cx} cy=${cy} r=${r} fill="none" stroke=${cor} stroke-width="14"
          stroke-dasharray=${dashArr} stroke-linecap="round"
          transform=${rotateT} style=${{transition:'stroke-dasharray .6s ease'}}/>
        <text x=${cx} y=${cy-8} text-anchor="middle" fill=${cor} font-size="22" font-weight="900">${Math.round(pct*100)+'%'}</text>
        <text x=${cx} y=${cy+12} text-anchor="middle" fill=${C.muted} font-size="9">atingido</text>
        <text x=${cx} y=${cy+26} text-anchor="middle" fill=${C.text} font-size="8">${meta>0?fmt(meta):'Sem meta'}</text>
      </svg>
      <div style=${{flex:1}}>
        <div style=${{marginBottom:10}}>
          <div style=${{fontSize:10,color:C.muted,marginBottom:2}}>Recebido</div>
          <div style=${{fontSize:16,fontWeight:800,color:C.green}}>${fmt(valor)}</div>
        </div>
        <div style=${{marginBottom:10}}>
          <div style=${{fontSize:10,color:C.muted,marginBottom:2}}>Meta</div>
          <div style=${{fontSize:16,fontWeight:800,color:cor}}>${meta>0?fmt(meta):'—'}</div>
        </div>
        <div>
          <div style=${{fontSize:10,color:C.muted,marginBottom:2}}>Falta</div>
          <div style=${{fontSize:16,fontWeight:800,color:Math.max(0,meta-valor)>0?C.red:C.green}}>${meta>0?fmt(Math.max(0,meta-valor)):'—'}</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ── GRÁFICO: BARRAS RECEITA × DESPESA ────────────────────────────────────────
function BarRecDesp({dados,height=160}){
  if(!dados||!dados.length) return html`<${Empty} msg="Sem lançamentos no período"/>`;
  const maxVal=Math.max(...dados.flatMap(d=>[d.receita,d.despesa]),1);
  const n=dados.length;
  const gw=100/n;
  const bw=gw*0.32;
  const areaH=height-22;
  return html`<div>
    <div style=${{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>📊 Receitas × Despesas — últimos meses</div>
    <div style=${{display:'flex',gap:12,marginBottom:8}}>
      <span style=${{fontSize:10,color:C.green,display:'flex',alignItems:'center',gap:4}}><span style=${{width:10,height:10,background:C.green,borderRadius:2,display:'inline-block'}}/> Receita</span>
      <span style=${{fontSize:10,color:C.red,display:'flex',alignItems:'center',gap:4}}><span style=${{width:10,height:10,background:C.red,borderRadius:2,display:'inline-block'}}/> Despesa</span>
    </div>
    <svg viewBox="0 0 100 ${height}" preserveAspectRatio="none" style=${{width:'100%',height:height+'px',display:'block'}}>
      ${dados.map((d,i)=>{
        const recH=(d.receita/maxVal)*areaH;
        const despH=(d.despesa/maxVal)*areaH;
        const gx=i*gw;
        return html`<g key=${i}>
          <rect x=${gx+gw*0.06} y=${areaH-recH} width=${bw} height=${recH} fill=${C.green} rx="1.5"/>
          <rect x=${gx+gw*0.06+bw+gw*0.04} y=${areaH-despH} width=${bw} height=${despH} fill=${C.red} rx="1.5"/>
          <text x=${gx+gw/2} y=${height-5} text-anchor="middle" fill=${C.muted} font-size="5">${d.mes}</text>
        </g>`;
      })}
    </svg>
  </div>`;
}

function Dashboard({db,isMobile}){
  const [data,setData]=useState({pedidos:[],lancMes:[],despMes:[],receber:[],meta:0,chartData:[]});
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    (async()=>{
      setLoading(true);
      try{
        const proxMes=MES_ATUAL===12?`${ANO_ATUAL+1}-01-01`:`${ANO_ATUAL}-${mesStr(MES_ATUAL+1)}-01`;
        const d6=new Date(ANO_ATUAL,MES_ATUAL-7,1);
        const d6str=`${d6.getFullYear()}-${mesStr(d6.getMonth()+1)}-01`;
        const [pedidos,lancMes,despMes,receber,metas,lanc6m]=await Promise.all([
          db.get('pedidos'),
          db.get('lancamentos',`tipo=eq.receita&data=gte.${ANO_ATUAL}-${mesStr(MES_ATUAL)}-01&data=lt.${proxMes}`),
          db.get('lancamentos',`tipo=eq.despesa&data=gte.${ANO_ATUAL}-${mesStr(MES_ATUAL)}-01&data=lt.${proxMes}`),
          db.get('contas_receber'),
          db.get('metas',`ano=eq.${ANO_ATUAL}&mes=eq.${MES_ATUAL}`),
          db.get('lancamentos',`data=gte.${d6str}&order=data.asc`)
        ]);
        const porMes={};
        lanc6m.forEach(l=>{
          const m=l.data?.slice(0,7)||'';if(!m)return;
          if(!porMes[m])porMes[m]={mes:MESES[parseInt(m.slice(5))-1].slice(0,3),receita:0,despesa:0};
          porMes[m][l.tipo]+= +l.valor;
        });
        const chartData=Object.entries(porMes).sort(([a],[b])=>a.localeCompare(b)).slice(-6).map(([,v])=>v);
        setData({pedidos,lancMes,despMes,receber,meta:metas?.[0]?.valor||0,chartData});
      }catch{}finally{setLoading(false);}
    })();
  },[]);
  if(loading) return html`<${Spin}/>`;
  const tRec=data.receber.filter(c=>c.status!=='Pago').reduce((s,c)=>s+ +c.valor,0);
  const ativos=data.pedidos.filter(p=>p.status!=='Concluído');
  const recMes=data.lancMes.reduce((s,l)=>s+ +l.valor,0);
  const despMes=data.despMes.reduce((s,l)=>s+ +l.valor,0);
  const resultado=recMes-despMes;
  const cP={Orçamento:C.muted,Aprovação:C.purple,Arte:C.gold,Produção:C.blue,Entrega:C.green,Concluído:C.green};
  // Margem média da carteira (pedidos com custo cadastrado)
  const comCusto=data.pedidos.filter(p=>+p.custo_total>0&&+p.valor_total>0);
  const margemMedia=comCusto.length>0?Math.round(comCusto.reduce((s,p)=>s+((p.valor_total-p.custo_total)/p.valor_total*100),0)/comCusto.length):null;
  // Alertas de prazo — pedidos ativos vencendo em até 3 dias ou atrasados
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const prazosAlerta=ativos.filter(p=>p.prazo).map(p=>{
    const pz=new Date(p.prazo+'T00:00:00');
    const dias=Math.round((pz-hoje)/86400000);
    return {...p,dias};
  }).filter(p=>p.dias<=3).sort((a,b)=>a.dias-b.dias);
  return html`<div style=${{display:'flex',flexDirection:'column',gap:14}}>
    <div style=${{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(auto-fit,minmax(155px,1fr))',gap:10}}>
      <${MetaCard} metaMes=${data.meta} receitaMes=${recMes} isMobile=${isMobile}/>
      <${KpiCard} title="Receita do Mês" value=${fmt(recMes)} sub=${MESES[MES_ATUAL-1]} icon="💰" color=${C.green}/>
      <${KpiCard} title="Despesas do Mês" value=${fmt(despMes)} sub=${MESES[MES_ATUAL-1]} icon="📤" color=${C.red}/>
      <${KpiCard} title="Resultado do Mês" value=${fmt(resultado)} sub="receita − despesa" icon="📊" color=${resultado>=0?C.green:C.red}/>
      <${KpiCard} title="Margem Média" value=${margemMedia!==null?margemMedia+'%':'—'} sub="da carteira" icon="📈" color=${C.green}/>
      <${KpiCard} title="Pedidos Ativos" value=${ativos.length} sub="em andamento" icon="📦" color=${C.blue}/>
      <${KpiCard} title="A Receber" value=${fmt(tRec)} sub="em aberto" icon="🏦" color=${C.purple}/>
    </div>
    <div style=${{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:14}}>
      <${Card}>
        <${GaugeMeta} valor=${recMes} meta=${data.meta}/>
      </${Card}>
      <${Card}>
        <${BarRecDesp} dados=${data.chartData} height=${isMobile?150:170}/>
      </${Card}>
    </div>
    ${prazosAlerta.length>0&&html`<div style=${{background:C.red+'11',border:`1px solid ${C.red}33`,borderRadius:12,padding:12}}>
      <div style=${{fontWeight:700,color:C.red,fontSize:12,marginBottom:8}}>⏰ Prazos Próximos ou Atrasados</div>
      <div style=${{display:'flex',flexDirection:'column',gap:6}}>
        ${prazosAlerta.map(p=>html`<div key=${p.id} style=${{display:'flex',justifyContent:'space-between',alignItems:'center',background:C.card,borderRadius:8,padding:'8px 10px'}}>
          <div>
            <span style=${{fontSize:12,color:C.gold,fontWeight:700,fontFamily:'monospace'}}>${p.codigo}</span>
            <span style=${{fontSize:12,color:C.text,marginLeft:8}}>${p.cliente_nome}</span>
          </div>
          <${Badge} label=${p.dias<0?`${Math.abs(p.dias)}d atrasado`:p.dias===0?'Vence hoje':`${p.dias}d restantes`} color=${p.dias<0?C.red:p.dias===0?C.red:C.gold}/>
        </div>`)}
      </div>
    </div>`}
    <${Card}>
      <${SecTitle}>Pedidos Recentes</${SecTitle}>
      ${data.pedidos.length===0?html`<${Empty}/>`:data.pedidos.slice(0,5).map(p=>{
        const cor=cP[p.status]||C.muted;
        return html`<div key=${p.id} style=${{background:C.surface,borderRadius:10,padding:12,borderLeft:`3px solid ${cor}`,marginBottom:8}}>
          <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div><div style=${{fontSize:10,color:C.gold,fontWeight:700}}>${p.codigo}</div>

              <${Badge} label=${p.status} color=${cor}/>

          </div>
          <div style=${{display:'flex',alignItems:'center',gap:8,marginTop:8}}>
            <${PBar} value=${p.progresso} color=${cor}/>
            <span style=${{fontSize:9,color:C.muted,minWidth:26}}>${p.progresso}%</span>
          </div>
        </div>`;
      })}
    </${Card}>
  </div>`;
}

// ── SEÇÃO: PEDIDOS ────────────────────────────────────────────────────────────
function Pedidos({db,isMobile}){
  const [rows,setRows]=useState([]);const [loading,setLoading]=useState(true);const [modal,setModal]=useState(null);
  const cP={Orçamento:C.muted,Aprovação:C.purple,Arte:C.gold,Produção:C.blue,Entrega:C.green,Concluído:C.green};
  const load=useCallback(async()=>{setLoading(true);try{setRows(await db.get('pedidos'));}catch{}finally{setLoading(false);}  },[]);
  useEffect(()=>{load();},[]);
  const del=async id=>{if(!confirm('Excluir pedido?'))return;await db.del('pedidos',id);load();};
  const ativos=rows.filter(p=>p.status!=='Concluído');
  const comCusto=rows.filter(p=>+p.custo_total>0&&+p.valor_total>0);
  const margemMediaP=comCusto.length>0?Math.round(comCusto.reduce((s,p)=>s+((p.valor_total-p.custo_total)/p.valor_total*100),0)/comCusto.length):null;
  return html`<div style=${{display:'flex',flexDirection:'column',gap:14}}>

      <${KpiCard} title="Pedidos Ativos" value=${ativos.length} sub="em andamento" icon="📋" color=${C.blue}/>

      <${KpiCard} title="Margem Média" value=${margemMediaP!==null?margemMediaP+'%':'—'} sub="da carteira" icon="📈" color=${C.green}/>
      <${KpiCard} title="Concluídos" value=${rows.filter(p=>p.status==='Concluído').length} sub="total" icon="✅" color=${C.green}/>

      const cor=cP[p.status]||C.muted;
      const vt=+p.valor_total||0; const ct=+p.custo_total||0;

          <div style=${{textAlign:'right'}}><${Badge} label=${p.status} color=${cor}/>
            ${p.prazo&&html`<div style=${{fontSize:10,color:C.muted,marginTop:4}}>📅 ${new Date(p.prazo+'T12:00').toLocaleDateString('pt-BR')}</div>`}</div>
        </div>
        <div style=${{display:'flex',justifyContent:'space-between',marginBottom:7}}>
          <span style=${{fontSize:15,color:C.green,fontWeight:800}}>${fmt(p.valor_total)}</span>
          <span style=${{fontSize:10,color:C.muted}}>${fmtN(p.quantidade_itens)} itens</span>

          <span style=${{fontSize:10,color:C.muted}}>Custo: ${fmt(ct)}</span>

// ── SEÇÃO: CLIENTES ───────────────────────────────────────────────────────────
function Clientes({db,isMobile}){
  const [rows,setRows]=useState([]);const [pedidos,setPedidos]=useState([]);
  const [loading,setLoading]=useState(true);const [modal,setModal]=useState(null);
  const [busca,setBusca]=useState('');const [soSumidos,setSoSumidos]=useState(false);
  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const [cli,ped]=await Promise.all([db.get('clientes'),db.get('pedidos')]);
      setRows(cli);setPedidos(ped);
    }catch{}finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[]);
  const del=async id=>{if(!confirm('Excluir cliente?'))return;await db.del('clientes',id);load();};

  const norm=s=>(s||'').trim().toLowerCase();
  const statsCliente=nome=>{
    const matched=pedidos.filter(p=>norm(p.cliente_nome)===norm(nome));
    const totalComprado=matched.reduce((s,p)=>s+ +p.valor_total,0);
    const qtdPedidos=matched.length;
    const datas=matched.map(p=>p.created_at).filter(Boolean).sort();
    const ultimaData=datas.length?datas[datas.length-1]:null;
    let diasSemComprar=null;
    if(ultimaData){
      diasSemComprar=Math.floor((Date.now()-new Date(ultimaData))/86400000);
    }
    const sumido=qtdPedidos===0||diasSemComprar>90;
    return {totalComprado,qtdPedidos,ultimaData,diasSemComprar,sumido};
  };

  const enriquecidos=rows.map(r=>({...r,_stats:statsCliente(r.nome)}));
  const totalSumidos=enriquecidos.filter(r=>r._stats.sumido).length;
  const fil=enriquecidos.filter(r=>{
    const matchBusca=r.nome?.toLowerCase().includes(busca.toLowerCase())||r.setor?.toLowerCase().includes(busca.toLowerCase());
    if(soSumidos) return matchBusca&&r._stats.sumido;
    return matchBusca;
  });

  return html`<div style=${{display:'flex',flexDirection:'column',gap:14}}>
    <${KpiGrid} isMobile=${isMobile}>
      <${KpiCard} title="Total Clientes" value=${rows.length} sub="cadastrados" icon="🏢" color=${C.blue}/>
      <${KpiCard} title="Setores" value=${new Set(rows.map(r=>r.setor).filter(Boolean)).size} sub="diferentes" icon="🏷️" color=${C.gold}/>
      <${KpiCard} title="Clientes Sumidos" value=${totalSumidos} sub="90+ dias sem comprar" icon="⚠️" color=${totalSumidos>0?C.red:C.green}/>
    </${KpiGrid}>
    <div style=${{display:'flex',gap:10,flexWrap:'wrap'}}>
      <input value=${busca} onInput=${e=>setBusca(e.target.value)} placeholder="🔍 Buscar cliente..." style=${{flex:1,minWidth:150,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:'10px 14px',color:C.text,fontSize:13,outline:'none'}}/>
      <${Btn} color=${soSumidos?C.red:C.muted} onClick=${()=>setSoSumidos(s=>!s)}>${soSumidos?'✓ ':''}Sumidos</${Btn}>
      <${Btn} onClick=${()=>setModal({})}>+ Cliente</${Btn}>
    </div>
    ${loading?html`<${Spin}/>`:fil.length===0?html`<${Empty} msg="Nenhum cliente encontrado"/>`:fil.map(c=>{
      const st=c._stats;
      return html`<div key=${c.id} style=${{background:C.card,borderRadius:12,padding:13,border:`1px solid ${C.border}`,borderLeft:st.sumido?`3px solid ${C.red}`:`3px solid ${C.border}`,marginBottom:8}}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><div style=${{fontSize:13,color:C.text,fontWeight:700}}>${c.nome}</div>
          <div style=${{marginTop:4,display:'flex',gap:6,flexWrap:'wrap'}}>
            ${c.setor&&html`<${Badge} label=${c.setor} color=${C.blue}/>`}
            ${st.sumido&&html`<${Badge} label=${st.qtdPedidos===0?'Nunca comprou':'Sumido'} color=${C.red}/>`}
          </div>
        </div>
      </div>
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:7,marginTop:10}}>
        <div style=${{textAlign:'center',background:C.surface,borderRadius:8,padding:'6px 4px'}}>
          <div style=${{fontSize:13,color:C.gold,fontWeight:800}}>${st.qtdPedidos}</div>
          <div style=${{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Pedidos</div>
        </div>
        <div style=${{textAlign:'center',background:C.surface,borderRadius:8,padding:'6px 4px'}}>
          <div style=${{fontSize:11,color:C.green,fontWeight:800}}>${st.totalComprado>0?fmt(st.totalComprado):'—'}</div>
          <div style=${{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Total</div>
        </div>
        <div style=${{textAlign:'center',background:C.surface,borderRadius:8,padding:'6px 4px'}}>
          <div style=${{fontSize:11,color:st.sumido?C.red:C.text,fontWeight:800}}>${st.ultimaData?`${st.diasSemComprar}d atrás`:'Nunca'}</div>
          <div style=${{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Últ. Compra</div>
        </div>
      </div>
      <div style=${{marginTop:8,display:'flex',gap:12,flexWrap:'wrap'}}>
        ${c.email&&html`<span style=${{fontSize:11,color:C.muted}}>✉️ ${c.email}</span>`}
        ${c.telefone&&html`<span style=${{fontSize:11,color:C.muted}}>📞 ${c.telefone}</span>`}
      </div>
      <div style=${{display:'flex',gap:7,marginTop:10}}>
        <${Btn} small onClick=${()=>setModal({item:c})}>✏️ Editar</${Btn}>
        <${Btn} small color=${C.red} onClick=${()=>del(c.id)}>🗑 Excluir</${Btn}>
      </div>
    </div>`;})}
    ${modal!==null&&html`<${Modal} title=${modal.item?'Editar Cliente':'Novo Cliente'} onClose=${()=>setModal(null)}>
      <${FormCliente} db=${db} item=${modal.item} onDone=${ok=>{setModal(null);if(ok)load();}}/>
    </${Modal}>`}
  </div>`;
}

// ── SEÇÃO: METAS ──────────────────────────────────────────────────────────────
function Metas({db,isMobile}){
  const [ano,setAno]=useState(ANO_ATUAL);
  const [valores,setValores]=useState(Array(12).fill(''));
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState('');
  const [msgTipo,setMsgTipo]=useState('ok');

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      try{
        const rows=await db.get('metas',`ano=eq.${ano}`);
        const vals=Array(12).fill('');
        rows.forEach(r=>{vals[r.mes-1]=r.valor>0?String(r.valor):'';});
        setValores(vals);
      }catch{}finally{setLoading(false);}
    })();
  },[ano]);

  const save=async()=>{
    setSaving(true);setMsg('');
    try{
      const ops=valores.map((v,i)=>v&&+v>0?db.upsert('metas',{ano,mes:i+1,valor:+v},'ano,mes'):Promise.resolve());
      await Promise.all(ops);
      setMsg('Metas salvas com sucesso!');setMsgTipo('ok');
      setTimeout(()=>setMsg(''),3000);
    }catch(e){setMsg('Erro: '+e.message);setMsgTipo('err');}
    finally{setSaving(false);}
  };

  const totalMeta=valores.reduce((s,v)=>s+(+v||0),0);
  const mediaMeta=totalMeta/12;

  return html`<div style=${{display:'flex',flexDirection:'column',gap:14}}>
    <${KpiGrid} isMobile=${isMobile}>
      <${KpiCard} title="Meta Anual" value=${fmt(totalMeta)} sub="soma dos meses" icon="🎯" color=${C.gold}/>
      <${KpiCard} title="Média Mensal" value=${fmt(mediaMeta)} sub="por mês" icon="📊" color=${C.blue}/>
      <${KpiCard} title="Meses Definidos" value=${valores.filter(v=>+v>0).length} sub="de 12" icon="📅" color=${C.green}/>
      <${KpiCard} title="Mês Atual" value=${fmt(+valores[MES_ATUAL-1]||0)} sub=${MESES[MES_ATUAL-1]} icon="⭐" color=${C.purple}/>
    </${KpiGrid}>

    <${Card}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>

        <div style=${{display:'flex',gap:8,alignItems:'center'}}>
          <button onClick=${()=>setAno(a=>a-1)} style=${{background:C.surface,border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:13}}>‹</button>
          <span style=${{color:C.text,fontWeight:700,fontSize:14}}>${ano}</span>
          <button onClick=${()=>setAno(a=>a+1)} style=${{background:C.surface,border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:13}}>›</button>
        </div>

      ${loading?html`<${Spin}/>`:html`<div>
        <div style=${{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(3,1fr)',gap:10,marginBottom:16}}>
          ${MESES.map((mes,i)=>html`<div key=${i} style=${{background:C.surface,borderRadius:10,padding:12,border:`1px solid ${i===MES_ATUAL-1&&ano===ANO_ATUAL?C.gold:C.border}`,position:'relative'}}>
            ${i===MES_ATUAL-1&&ano===ANO_ATUAL&&html`<div style=${{position:'absolute',top:6,right:8,fontSize:9,color:C.gold,fontWeight:700}}>ATUAL</div>`}
            <div style=${{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>${mes}</div>
            <div style=${{position:'relative'}}>
              <span style=${{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:C.muted,fontSize:12,pointerEvents:'none'}}>R$</span>
              <input type="number" step="0.01" min="0"
                value=${valores[i]}
                onInput=${e=>{const v=[...valores];v[i]=e.target.value;setValores(v);}}

                style=${{...inputSt,paddingLeft:30,fontSize:13}}/>

    </${Card}>

}

// ── MENUS ─────────────────────────────────────────────────────────────────────
// ── SEÇÃO: HISTÓRICO ─────────────────────────────────────────────────────────
function Historico({db,isMobile}){
  const [ano,setAno]=useState(ANO_ATUAL);
  const [dados,setDados]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      try{
        const [lanc,metas,peds]=await Promise.all([
          db.get('lancamentos',`data=gte.${ano}-01-01&data=lte.${ano}-12-31&order=data.asc`),
          db.get('metas',`ano=eq.${ano}`),
          db.get('pedidos',`created_at=gte.${ano}-01-01T00:00:00&created_at=lte.${ano}-12-31T23:59:59`)
        ]);
        const pm={};
        for(let m=1;m<=12;m++) pm[m]={mes:m,receita:0,despesa:0,meta:0,pedidos:0};
        lanc.forEach(l=>{const m=parseInt(l.data?.slice(5,7));if(pm[m]) pm[m][l.tipo]+= +l.valor;});
        metas.forEach(r=>{if(pm[r.mes]) pm[r.mes].meta= +r.valor;});
        peds.forEach(p=>{const m=parseInt(p.created_at?.slice(5,7));if(pm[m]) pm[m].pedidos++;});
        setDados(Object.values(pm));
      }catch{}finally{setLoading(false);}
    })();
  },[ano]);

  const totalRec=dados.reduce((s,d)=>s+d.receita,0);
  const totalDesp=dados.reduce((s,d)=>s+d.despesa,0);
  const totalMeta=dados.reduce((s,d)=>s+d.meta,0);
  const resultado=totalRec-totalDesp;
  const mesesComDados=dados.filter(d=>d.receita>0||d.despesa>0).length;
  const maxVal=Math.max(...dados.flatMap(d=>[d.receita,d.despesa,d.meta]),1);

  // Gráfico de barras anual — chamado como função, não como componente
  const renderGrafico=()=>{
    const h=isMobile?140:180; const aH=h-24; const gw=100/12; const bw=gw*0.28;
    return html`<div>
      <div style=${{display:'flex',gap:12,marginBottom:8,flexWrap:'wrap'}}>
        <span style=${{fontSize:10,color:C.green,display:'flex',alignItems:'center',gap:4}}><span style=${{width:10,height:10,background:C.green,borderRadius:2,display:'inline-block'}}/> Receita</span>
        <span style=${{fontSize:10,color:C.red,display:'flex',alignItems:'center',gap:4}}><span style=${{width:10,height:10,background:C.red,borderRadius:2,display:'inline-block'}}/> Despesa</span>
        <span style=${{fontSize:10,color:C.gold,display:'flex',alignItems:'center',gap:4}}><span style=${{width:10,height:10,background:C.gold,borderRadius:2,display:'inline-block'}}/> Meta</span>
      </div>
      <svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" style=${{width:'100%',height:h+'px',display:'block'}}>
        ${dados.map((d,i)=>{
          const recH=(d.receita/maxVal)*aH;
          const despH=(d.despesa/maxVal)*aH;
          const metaH=(d.meta/maxVal)*aH;
          const gx=i*gw;
          const ativo=d.mes===MES_ATUAL&&ano===ANO_ATUAL;
          return html`<g key=${i}>
            ${ativo&&html`<rect x=${gx} y="0" width=${gw} height=${aH} fill="#3ECBA011" rx="1"/>`}
            <rect x=${gx+gw*0.04} y=${aH-recH} width=${bw} height=${recH} fill=${C.green} rx="1"/>
            <rect x=${gx+gw*0.04+bw+gw*0.02} y=${aH-despH} width=${bw} height=${despH} fill=${C.red} rx="1"/>
            ${d.meta>0&&html`<line x1=${gx+gw*0.04} y1=${aH-metaH} x2=${gx+gw*0.96} y2=${aH-metaH} stroke=${C.gold} stroke-width="0.8" stroke-dasharray="1.5,1"/>`}
            <text x=${gx+gw/2} y=${h-6} text-anchor="middle" fill=${ativo?C.gold:C.muted} font-size="4.5" font-weight=${ativo?'bold':'normal'}>${MESES[i].slice(0,3)}</text>
          </g>`;
        })}
      </svg>
    </div>`;
  };

  // Status da meta por mês
  const metaStatus=d=>{
    if(!d.meta) return {cor:C.muted,label:'—'};
    const pct=Math.round((d.receita/d.meta)*100);
    if(pct>=100) return {cor:C.green,label:`${pct}%`};
    if(pct>=70)  return {cor:C.gold, label:`${pct}%`};
    if(pct>=1)   return {cor:C.red,  label:`${pct}%`};
    return {cor:C.muted,label:'0%'};
  };

  return html`<div style=${{display:'flex',flexDirection:'column',gap:14}}>
    <!-- KPIs anuais -->
    <${KpiGrid} isMobile=${isMobile}>
      <${KpiCard} title="Receita Anual" value=${fmt(totalRec)} sub=${String(ano)} icon="💰" color=${C.green}/>
      <${KpiCard} title="Despesas Anuais" value=${fmt(totalDesp)} sub=${String(ano)} icon="📤" color=${C.red}/>
      <${KpiCard} title="Resultado Anual" value=${fmt(resultado)} sub="receita − despesa" icon="📊" color=${resultado>=0?C.green:C.red}/>
      <${KpiCard} title="Meta Anual" value=${totalMeta>0?fmt(totalMeta):'Não definida'} sub=${totalMeta>0?`${Math.round((totalRec/totalMeta)*100)}% atingido`:'Cadastre em Metas'} icon="🎯" color=${C.gold}/>
    </${KpiGrid}>

    <!-- Seletor de ano + gráfico -->
    <${Card}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style=${{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>📅 Visão Anual — ${ano}</div>
        <div style=${{display:'flex',gap:8,alignItems:'center'}}>
          <button onClick=${()=>setAno(a=>a-1)} style=${{background:C.surface,border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:'5px 12px',cursor:'pointer',fontSize:13}}>‹</button>
          <span style=${{color:C.text,fontWeight:700,fontSize:14,minWidth:40,textAlign:'center'}}>${ano}</span>
          <button onClick=${()=>setAno(a=>a+1)} style=${{background:C.surface,border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:'5px 12px',cursor:'pointer',fontSize:13}}>›</button>
        </div>
      </div>
      ${loading?html`<${Spin}/>`:(renderGrafico())}
    </${Card}>

    <!-- Tabela mês a mês -->
    <${Card}>
      <div style=${{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:12}}>Detalhamento Mês a Mês</div>
      ${loading?html`<${Spin}/>`:html`<div>
        <!-- Cabeçalho -->
        <div style=${{display:'grid',gridTemplateColumns:isMobile?'3fr 2fr 2fr 2fr':'3fr 2fr 2fr 2fr 2fr 2fr',gap:4,padding:'6px 8px',background:C.surface,borderRadius:8,marginBottom:6}}>
          ${['Mês','Receita','Despesa','Resultado', ...(isMobile?[]:['Meta','% Meta'])].map(h=>html`
            <div key=${h} style=${{fontSize:9,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:.5}}>${h}</div>`)}
        </div>
        <!-- Linhas -->
        ${dados.map(d=>{
          const res=d.receita-d.despesa;
          const ms=metaStatus(d);
          const ativo=d.mes===MES_ATUAL&&ano===ANO_ATUAL;
          const temDados=d.receita>0||d.despesa>0;
          return html`<div key=${d.mes} style=${{display:'grid',gridTemplateColumns:isMobile?'3fr 2fr 2fr 2fr':'3fr 2fr 2fr 2fr 2fr 2fr',gap:4,padding:'8px 8px',borderRadius:8,marginBottom:3,
            background:ativo?C.gold+'18':temDados?C.card:C.surface,
            border:ativo?`1px solid ${C.gold}44`:`1px solid transparent`,
            opacity:temDados||ativo?1:0.45}}>
            <div style=${{display:'flex',alignItems:'center',gap:6}}>
              ${ativo&&html`<span style=${{width:6,height:6,borderRadius:'50%',background:C.gold,display:'inline-block',flexShrink:0}}/>`}
              <span style=${{fontSize:12,color:ativo?C.gold:C.text,fontWeight:ativo?700:400}}>${MESES[d.mes-1]}</span>
            </div>
            <div style=${{fontSize:12,color:C.green,fontWeight:600}}>${d.receita>0?fmt(d.receita):'—'}</div>
            <div style=${{fontSize:12,color:C.red,fontWeight:600}}>${d.despesa>0?fmt(d.despesa):'—'}</div>
            <div style=${{fontSize:12,color:res>0?C.green:res<0?C.red:C.muted,fontWeight:600}}>${temDados?fmt(res):'—'}</div>
            ${!isMobile&&html`<div style=${{fontSize:12,color:C.muted}}>${d.meta>0?fmt(d.meta):'—'}</div>`}
            ${!isMobile&&html`<div style=${{fontSize:12,color:ms.cor,fontWeight:700}}>${ms.label}</div>`}
          </div>`;
        })}
        <!-- Totais -->
        <div style=${{display:'grid',gridTemplateColumns:isMobile?'3fr 2fr 2fr 2fr':'3fr 2fr 2fr 2fr 2fr 2fr',gap:4,padding:'10px 8px',borderRadius:8,marginTop:6,background:C.surface,borderTop:`2px solid ${C.border}`}}>
          <div style=${{fontSize:11,color:C.text,fontWeight:800}}>TOTAL</div>
          <div style=${{fontSize:11,color:C.green,fontWeight:800}}>${fmt(totalRec)}</div>
          <div style=${{fontSize:11,color:C.red,fontWeight:800}}>${fmt(totalDesp)}</div>
          <div style=${{fontSize:11,color:resultado>=0?C.green:C.red,fontWeight:800}}>${fmt(resultado)}</div>
          ${!isMobile&&html`<div style=${{fontSize:11,color:C.gold,fontWeight:800}}>${totalMeta>0?fmt(totalMeta):'—'}</div>`}
          ${!isMobile&&html`<div style=${{fontSize:11,color:totalMeta>0?(totalRec/totalMeta>=1?C.green:C.red):C.muted,fontWeight:800}}>${totalMeta>0?Math.round((totalRec/totalMeta)*100)+'%':'—'}</div>`}
        </div>
      </div>`}
    </${Card}>

    <!-- Cards por mês (mobile: resumo compacto) -->
    ${isMobile&&html`<div>
      <div style=${{fontSize:10,color:C.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>Resumo por Mês</div>
      ${dados.filter(d=>d.receita>0||d.despesa>0||d.meta>0).map(d=>{
        const res=d.receita-d.despesa;
        const ms=metaStatus(d);
        const ativo=d.mes===MES_ATUAL&&ano===ANO_ATUAL;
        return html`<div key=${d.mes} style=${{background:ativo?C.gold+'18':C.card,borderRadius:12,padding:12,marginBottom:8,border:`1px solid ${ativo?C.gold+'44':C.border}`,borderLeft:`3px solid ${ms.cor}`}}>
          <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <span style=${{fontSize:13,color:ativo?C.gold:C.text,fontWeight:700}}>${MESES[d.mes-1]} ${ano}</span>
            <span style=${{fontSize:13,color:ms.cor,fontWeight:800}}>${ms.label}</span>
          </div>
          <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <div style=${{background:C.surface,borderRadius:8,padding:'6px 8px'}}>
              <div style=${{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Receita</div>
              <div style=${{fontSize:13,color:C.green,fontWeight:700}}>${d.receita>0?fmt(d.receita):'—'}</div>
            </div>
            <div style=${{background:C.surface,borderRadius:8,padding:'6px 8px'}}>
              <div style=${{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Despesa</div>
              <div style=${{fontSize:13,color:C.red,fontWeight:700}}>${d.despesa>0?fmt(d.despesa):'—'}</div>
            </div>
            <div style=${{background:C.surface,borderRadius:8,padding:'6px 8px'}}>
              <div style=${{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Resultado</div>
              <div style=${{fontSize:13,color:res>=0?C.green:C.red,fontWeight:700}}>${d.receita>0||d.despesa>0?fmt(res):'—'}</div>
            </div>
            <div style=${{background:C.surface,borderRadius:8,padding:'6px 8px'}}>
              <div style=${{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Meta</div>
              <div style=${{fontSize:13,color:C.gold,fontWeight:700}}>${d.meta>0?fmt(d.meta):'—'}</div>
            </div>
          </div>
          ${d.meta>0&&html`<div style=${{marginTop:8}}>
            <${PBar} value=${Math.min(100,Math.round((d.receita/d.meta)*100))} color=${ms.cor}/>
          </div>`}
        </div>`;
      })}
      ${dados.filter(d=>d.receita>0||d.despesa>0||d.meta>0).length===0&&html`<${Empty} msg="Nenhum dado encontrado para ${ano}"/>`}
    </div>`}
  </div>`;
}
